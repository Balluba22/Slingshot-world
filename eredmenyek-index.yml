name: Eredmények jegyzék

# Ha az eredmenyek/ mappába új JSON kerül (vagy változik), újraépíti az index.json-t,
# amiből az app az Egyesületi archívum listáját tölti be. Kézzel is indítható.
on:
  push:
    branches: [main]
    paths:
      - 'eredmenyek/*.json'
      - '!eredmenyek/index.json'
      - 'scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.json előállítása
        run: python3 scripts/build_index.py
      - name: Commit, ha változott
        run: |
          if git diff --quiet -- eredmenyek/index.json; then
            echo "Nincs változás."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eredmenyek/index.json
          git commit -m "eredmenyek: index.json frissítése"
          git push
